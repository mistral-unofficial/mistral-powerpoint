# Builds the add-in and publishes it to GitHub Pages on every push to main.
# Hosted at https://mistral-unofficial.github.io/mistral-powerpoint/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - id: pages
        uses: actions/configure-pages@v5

      # Production manifest pointing at the Pages URL, published next to the add-in for download.
      - run: node scripts/make-prod-manifest.mjs "${{ steps.pages.outputs.base_url }}/" dist/manifest.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
